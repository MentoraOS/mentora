# MentoraOS — Release Pipeline (R5 Phase 2, Lot 3)
#
# LA RELEASE N'INVENTE RIEN. Elle certifie, documente et prouve que la
# vérité déjà produite par la CI est publiable. Ce pipeline NE DÉPLOIE
# PAS : il prépare une Release parfaitement vérifiée, avec la preuve
# complète de ce qui serait livré (artefact + SBOM + provenance +
# empreintes). Aucune commande recomposée à la main : les scripts du
# dépôt (`pnpm build`, `pnpm verify`) sont les seuls exécutés.
#
# Actions officielles uniquement, épinglées par SHA (résolus depuis les
# dépôts sources). Même fondation que ci.yml/nightly.yml : Node par
# .nvmrc, corepack 0.31.0, PostgreSQL éphémère identique — la gate de
# release EST la gate officielle, base réelle comprise.

name: release

on:
  workflow_dispatch: {} # préparer une release candidate à la demande, sans tag
  push:
    tags:
      - "v*" # les tags de release (protégés par le plan Rulesets : nés immuables)

permissions:
  contents: read # le pipeline lit et prouve ; il ne modifie rien

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # une certification se termine, elle ne s'annule pas

jobs:
  certify:
    name: certify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    outputs:
      version: ${{ steps.version.outputs.version }}

    services:
      postgres:
        # La gate officielle inclut les preuves d'intégration sur moteur
        # réel : une release qui les sauterait certifierait MOINS que la
        # CI. Service strictement identique à ci.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mentora
          POSTGRES_PASSWORD: mentora-ci-ephemeral
          POSTGRES_DB: mentora_agreement_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mentora -d mentora_agreement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MENTORA_AGREEMENT_DATABASE_URL: postgresql://mentora:mentora-ci-ephemeral@localhost:5432/mentora_agreement_test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node (version du repo — .nvmrc fait foi)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: platform/.nvmrc

      - name: Setup pnpm (corepack épinglé — même stratégie que ci.yml)
        run: |
          npm install -g corepack@0.31.0
          corepack enable

      - name: Version — le tag fait foi ; un dispatch produit une candidate datée
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="0.0.0-rc.$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version certifiée : ${VERSION}"

      - name: Install (lockfile gelé)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @mentora/adapters-persistence-agreement prisma:generate

      - name: Build — le script officiel du dépôt, jamais recomposé
        run: pnpm build

      - name: Prisma migrate deploy (la gate inclut l'intégration réelle)
        run: pnpm --filter @mentora/adapters-persistence-agreement exec prisma migrate deploy

      - name: Verify — rien ne se publie sans avoir repassé LA gate
        run: pnpm verify

      - name: SBOM — l'inventaire officiel GitHub (SPDX, zéro outil tiers)
        # Le dépôt ne possède aucun outil SBOM : le choix est l'API
        # Dependency-Graph de GitHub (SPDX 2.x) — officielle, dérivée du
        # lockfile réellement commité, sans dépendance ni action tierce.
        # Si l'API refuse, le Dependency Graph est désactivé dans les
        # settings : la release ÉCHOUE avec l'instruction — une release
        # sans inventaire ne se certifie pas.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../release-out
          if ! gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" > ../release-out/sbom.spdx.json; then
            echo '::error::SBOM indisponible — activer Settings > Advanced Security > Dependency graph, puis relancer.'
            exit 1
          fi
          echo "SBOM SPDX généré ($(wc -c < ../release-out/sbom.spdx.json) octets)"

      - name: Empaqueter l'artefact serveur (versionné, traçable)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="../release-out/mentora-server-${VERSION}"
          mkdir -p "$STAGE"
          cp -r apps/server/dist "$STAGE/dist"
          cp apps/server/package.json apps/server/README.md "$STAGE/"
          tar -czf "../release-out/mentora-server-${VERSION}.tar.gz" -C ../release-out "mentora-server-${VERSION}"
          rm -rf "$STAGE"

      - name: Empreintes + provenance documentaire (toujours produites)
        # Provenance de niveau 1 — AUTO-PORTÉE, non signée, toujours
        # disponible quel que soit le plan GitHub : QUI (workflow/run),
        # QUOI (empreintes SHA-256 des artefacts), D'OÙ (commit/ref),
        # QUAND. L'attestation cryptographique native est le job `attest`.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd ../release-out
          sha256sum "mentora-server-${VERSION}.tar.gz" sbom.spdx.json > SHA256SUMS
          cat > provenance.json <<EOF
          {
            "version": "${VERSION}",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "workflow": "${GITHUB_WORKFLOW}",
            "run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "runner": "${RUNNER_OS}-${RUNNER_ARCH}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "subjects": $(sha256sum "mentora-server-${VERSION}.tar.gz" sbom.spdx.json | awk '{printf "%s{\"name\":\"%s\",\"sha256\":\"%s\"}", sep, $2, $1; sep=","} END {print ""}' | sed 's/^/[/;s/$/]/')
          }
          EOF
          cat provenance.json

      - name: Publier l'artefact serveur
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mentora-server-${{ steps.version.outputs.version }}
          path: release-out/mentora-server-${{ steps.version.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Publier le SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mentora-sbom-${{ steps.version.outputs.version }}
          path: release-out/sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Publier provenance + empreintes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mentora-provenance-${{ steps.version.outputs.version }}
          path: |
            release-out/provenance.json
            release-out/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  attest:
    # Provenance de niveau 2 — l'ATTESTATION NATIVE GitHub (Artifact
    # Attestations, SLSA v1, signée Sigstore) : la meilleure stratégie
    # GitHub actuelle. BEST-EFFORT DÉCLARÉ : sur un dépôt privé sans
    # plan Enterprise, GitHub refuse la création d'attestation — ce job
    # est alors rouge-toléré (continue-on-error) et le run le MONTRE ;
    # la provenance de niveau 1 (job certify) reste la preuve garantie.
    name: attest (best-effort — exige Artifact Attestations)
    needs: certify
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # jeton OIDC éphémère du run — l'identité de la signature
      attestations: write # écrire l'attestation dans le registre du dépôt
    steps:
      - name: Récupérer l'artefact serveur
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mentora-server-${{ needs.certify.outputs.version }}

      - name: Attester la provenance de build (SLSA v1, Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: mentora-server-${{ needs.certify.outputs.version }}.tar.gz
